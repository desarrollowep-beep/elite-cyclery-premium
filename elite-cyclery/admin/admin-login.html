<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Panel Administrativo Elite Cyclery" />
  <title>Admin Login | Elite Cyclery</title>
    
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <section class="admin-login-page">
    <div class="login-overlay"></div>

    <div class="login-box">
      <div class="login-brand">
        <p class="admin-tag">PRIVATE DASHBOARD</p>
        <h1>Elite Cyclery</h1>
        <span>Administrador</span>
      </div>

      <form id="loginForm" class="login-form">
        <h2>Acceso Seguro</h2>
        <p>Ingresa tus credenciales para acceder al panel administrativo.</p>

        <div class="input-group">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            placeholder="admin@elitecyclery.com"
            required
          />
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            placeholder="••••••••••"
            required
          />
        </div>

        <button type="submit" class="login-btn">
          Ingresar al Panel
        </button>

        <p id="loginMessage" class="login-message"></p>
      </form>
    </div>
  </section>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');

    const ADMIN_EMAIL = 'admin@elitecyclery.com';
    const ADMIN_PASSWORD = 'Elite2026';

    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
        localStorage.setItem('eliteAdminAccess', 'true');
        window.location.href = 'admin-panel.html';
      } else {
        loginMessage.textContent = 'Correo o contraseña incorrectos.';
      }
    });
  </script>

</body>
</html>
