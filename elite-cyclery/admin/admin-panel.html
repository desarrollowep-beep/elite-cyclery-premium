<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Panel Administrativo Elite Cyclery" />
  <title>Admin Panel | Elite Cyclery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <section class="admin-panel-page">

    <aside class="sidebar">
      <div>
        <h2>ELITE <span>CYCLERY</span></h2>
        <p>Dashboard Premium</p>
      </div>

      <nav>
        <a href="#">Dashboard</a>
        <a href="#registerBike">Registrar Bicicleta</a>
        <a href="#bikeList">Inventario</a>
      </nav>

      <button id="logoutBtn" class="logout-btn">Cerrar sesión</button>
    </aside>

    <main class="main-content">

      <div class="top-header">
        <h1>Panel Administrativo</h1>
        <p>Gestión profesional de bicicletas premium</p>
      </div>

      <section class="register-section" id="registerBike">
        <h2>Registrar Nueva Bicicleta</h2>

        <form id="bikeForm" class="bike-form">

          <div class="form-grid">
            <input type="text" id="marca" placeholder="Marca" required>
            <input type="text" id="modelo" placeholder="Modelo" required>

            <select id="tipo" required>
              <option value="">Tipo</option>
              <option>Ruta</option>
              <option>MTB</option>
              <option>Urbana</option>
              <option>Eléctrica</option>
              <option>BMX</option>
            </select>

            <input type="text" id="rodada" placeholder="Rodada" required>
            <input type="text" id="color" placeholder="Color" required>
            <input type="text" id="serie" placeholder="Número de serie" required>
            <input type="text" id="precio" placeholder="Precio" required>
            <input type="number" id="stock" placeholder="Stock disponible" required>
          </div>

          <div class="full-width">
            <label>Imagen de la bicicleta</label>
            <input type="file" id="imagen" accept="image/*" required>
          </div>

          <div class="full-width">
            <textarea id="descripcion" rows="5" placeholder="Descripción completa de la bicicleta" required></textarea>
          </div>

          <button type="submit" class="save-btn">Registrar Bicicleta</button>
        </form>
      </section>

      <section class="inventory-section" id="bikeList">
        <h2>Inventario Registrado</h2>
        <div id="adminBikeList" class="admin-bike-grid"></div>
      </section>

    </main>
  </section>

  <script src="admin.js"></script>
</body>
</html>
